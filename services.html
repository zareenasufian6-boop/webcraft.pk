<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Arial, sans-serif}
body{background:#f8f9fa;color:#333;line-height:1.7}
header{background:#004aad;color:#fff;padding:18px 60px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
header h1{font-size:26px}
nav a{color:#fff;text-decoration:none;margin:0 16px;font-weight:600}
nav a:hover{border-bottom:2px solid #ffcc00}
.container{max-width:1200px;margin:auto;padding:60px 20px;text-align:center}
h1{font-size:36px;color:#004aad;margin-bottom:10px}
.subtitle{color:#666;margin-bottom:40px;font-size:17px}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:30px;margin-bottom:50px}
.price-card{background:#fff;border-radius:15px;box-shadow:0 6px 20px rgba(0,0,0,0.08);padding:30px;transition:0.3s;border-top:4px solid #004aad}

.price-card h3{font-size:22px;color:#004aad;margin-bottom:10px}
.price{font-size:32px;color:#ff6600;font-weight:bold;margin:15px 0}
.price span{font-size:14px;color:#777}
.features-list{list-style:none;text-align:left;margin:20px 0}
.features-list li{margin-bottom:10px;padding-left:25px;position:relative}
.features-list li:before{content:"✓";color:#004aad;font-weight:bold;position:absolute;left:0}
.btn{background:#004aad;color:#fff;padding:12px 25px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#003580}
.per-page{margin:40px;background:#eaf4ff;padding:25px;border-radius:12px;text-align:left}
.per-page h2{color:#004aad;margin-bottom:15px;text-align:center}
.per-page table{width:100%;border-collapse:collapse;margin-top:15px}
.per-page th, .per-page td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
.per-page th{background:#004aad;color:#fff}
footer{background:#004aad;color:#fff;text-align:center;padding:25px;margin-top:50px}
